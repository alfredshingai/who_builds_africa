name: Correction request
description: Report an error in published data
title: "correction: [RECORD ID] field"
labels: [correction]
body:
  - type: input
    id: record
    attributes:
      label: Record ID (wba_*)
      placeholder: "wba_prj_01HREAL001 or wba_clm_01HREAL001"
    validations: { required: true }
  - type: input
    id: field
    attributes:
      label: Field + current value
      placeholder: "contracts.value_original: 1500000000 approx (should be ...)"
    validations: { required: true }
  - type: textarea
    id: proposed
    attributes:
      label: Proposed value + source (URL + verbatim quote + evidence_strength)"
      placeholder: "Propose: USD 997700000 approx - source https://... | Xinhua | 2018-06-27 | \"...\" | evidence_strength officially_reported"
    validations: { required: true }
  - type: textarea
    id: reason
    attributes:
      label: Why current is wrong/disputed"
      placeholder: "Sources disagree, or typo, or new evidence"
